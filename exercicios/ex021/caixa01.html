<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        /* box-level */

        h1 {
            background-color: darkgray;
            height: 300px;
            width: 300px;

            /* border-width: 10px;
            border-style: solid;
            border-color: darkslategray;
            */
            border: 10px solid darkslategray;


            /*padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            */
            padding: 10px;

        }

        /* inline-level*/

        a {
            border: 20px solid blue;

            /*padding-top: 15px;
            padding-right: 15px;
            padding-bottom: 5px;
            padding-left: 10px;
            */
            padding: 15px 15px 5px 10px;

        }

        h2 {
            background-color: aqua;
            height: 200px;
            width: 200px;
            
            margin: auto;

            border: 10px solid black;
            
            padding-left: 20px;

            
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level </a> Vamos ver como tudo isso funciona.</p>
    <h2>TESTE MARGIN:AUTO</h2>
</body>
</html>
