<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imagens/favicon01.ico" type="image/x-icon">
    <title>Videos em HTML5</title>
</head>
<body>
    <h1>Inserindo videos hospedados localmente</h1>
    <hr>
    <p>Este video está hospedado no meu próprio servidor.</p>
    <video width="500" poster="imagens/capa.png" controls autoplay loop>
        <source src="videos/meu_video.mp4" type="video/mp4">
        <source src="videos/meu video-mav.mp4" type="video/m4v">
        <source src="videos/meu video.webm" type="video/webm">
        <source src="videos/meu_video.ogv" type="video/ogg">
        <p>Seu navegador não tem compatibilidade com a reprodução de videos.</p>
    </video>
    <h1>Inserindo videos do YouTube</h1>
    <hr>
    <iframe width="500" height="315" src="https://www.youtube.com/embed/EmK7f0CQ-N8?si=BGTdH5BQ1rPEFCyx" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <h1>Inserindo video do Vimeo</h1>
    <hr>
    <iframe title="vimeo-player" src="https://player.vimeo.com/video/18245160?h=79ad26c528" width="500" height="315" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   allowfullscreen></iframe>
</body>
</html>
