<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 10px;
        }

        table {
            border-collapse: collapse;
            width: 400px;
        }

        thead {
            background-color: gray;
            text-align: center;
            color: white;
        }

        td,th {
            border: 1px solid black;
            font-weight: bold;
            padding: 5px;
        }

        .cor {
            background-color: gray;
            color: white;
            text-align: left;
        }

        .num {
            text-align: center;
        }
    </style>

</head>
<body>
    <table>
        <caption>

        </caption>

        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>

            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td class="num">7.0</td>
                <td class="num">9.0</td>
                <td class="num">8.0</td>
            </tr>

            <tr>
                <td>Física</td>
                <td class="num">6.5</td>
                <td class="num">7.5</td>
                <td class="num">7.0</td>
            </tr>

            <tr>
                <td>Química</td>
                <td class="num">8.0</td>
                <td class="num">8.5</td>
                <td class="num">8.3</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td class="num">9.0</td>
                <td class="num">8.0</td>
                <td class="num">8.5</td>
            </tr>

            <tr>
                <th class="cor" colspan="4">Média de Exatas</th>
                <td class="num">7.9</td>
            </tr>

            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td class="num">8.0</td>
                <td class="num">9.0</td>
                <td class="num">8.5</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td class="num">7.5</td>
                <td class="num">8.5</td>
                <td class="num">8.0</td>
            </tr>

            <tr>
                <th class="cor" colspan="4">Média de Humanas</th>
                <td class="num">8.3</td>
            </tr>
        </tbody>

        <tfoot>

        </tfoot>
    </table>
</body>
</html>
